[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-sql-agent"
version = "0.11.0"
requires-python = ">=3.13,<3.14"
dependencies = ["portfolio-llm-evals==0.4.0", "sqlglot>=30", "fastapi>=0.115", "uvicorn>=0.34", "streamlit>=1.44", "sentence-transformers>=6,<7", "torch>=2.8,<2.14", "transformers>=4.57,<5.17", "numpy>=2.5,<2.6"]

[project.optional-dependencies]
benchmarks = ["huggingface-hub>=0.34"]
train = ["torch==2.8.0", "transformers==4.57.6", "trl==0.25.1", "peft==0.18.1", "bitsandbytes==0.49.2", "accelerate==1.10.1", "datasets==4.4.1", "huggingface-hub==0.36.0"]

[project.scripts]
sql-agent = "sql_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sql_agent = ["resources/*.json", "resources/*.jsonl", "resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --basetemp=../artifacts/pytest-sql-agent"
cache_dir = "../artifacts/pytest-cache-sql-agent"
